name: Package and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package, for example v1.1.1"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.CF_API_KEY || secrets.CURSEFORGE_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone Project
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare manual release tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            git checkout --force "refs/tags/${TAG}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

          git describe --tags --exact-match

      - name: Package and Release
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ secrets.CURSEFORGE_PROJECT_ID && format('-p {0}', secrets.CURSEFORGE_PROJECT_ID) || '' }}
